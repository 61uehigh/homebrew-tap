name: Update uncork

# Points Formula/uncork.rb at the latest release of 61uehigh/uncork. Uses only this repository's short-lived
# GITHUB_TOKEN, so no key or token with access to this repository is stored anywhere. Runs on a schedule and by hand;
# neither can be started by anyone without write access here.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-uncork
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest release excludes drafts and pre-releases.
          tag=$(gh release view --repo 61uehigh/uncork --json tagName --jq .tagName)
          url="https://github.com/61uehigh/uncork/archive/refs/tags/${tag}.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output source.tar.gz "$url"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum source.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          rm source.tar.gz

      - name: Update and push the formula
        env:
          TAG: ${{ steps.release.outputs.tag }}
          URL: ${{ steps.release.outputs.url }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          sed -i -E \
            -e "s|^  url \".*\"$|  url \"${URL}\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"${SHA256}\"|" \
            Formula/uncork.rb
          if git diff --quiet; then
            echo "Formula already points at ${TAG}."
            exit 0
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "uncork ${TAG#v}"
          git push
